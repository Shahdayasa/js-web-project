<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo -List </title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<div class="modal" id="deleteModal">
  <div class="modal-content">
    <p>Are you sure you want to delete this task?</p>
    <div class="modal-actions">
      <button class="confirm-btn" id="confirmDelete">Yes</button>
      <button class="cancel-btn" id="cancelDelete">No</button>
    </div>
  </div>
</div>
<body>
<h1>TodoInput</h1>
<div class="input-box">
<div class="test">
    <i class="fa-solid fa-book"></i>
<input type="text" placeholder="New Todo" id="todoInput" >
<p class="error-msg" id="errorMsg"></p>
</div>
<button class="add-btn" id="addBtn">Add new task </button>
</div>

<h1>Todo List</h1>

<div class="list-btn">
<button>All</button>
<button id="doneBtn">Done</button>
<button>Todo</button>

</div>
<ul id="todoList">


    
</ul>
    <script src="script.js"></script>
</body>
</html>
